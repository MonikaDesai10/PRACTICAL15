<!DOCTYPE html>
<html>
<head>
    <title>Student Prediction</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Student Performance Prediction</h2>

    <label>Attendance (%)</label><br>
    <input type="number" id="attendance" placeholder="Enter attendance"><br>

    <label>Internal Marks</label><br>
    <input type="number" id="marks" placeholder="Enter marks"><br>

    <button onclick="predict()">Predict</button>

    <div id="result"></div>

    <script>

        function predict() {

            let attendance = document.getElementById("attendance").value;
            let marks = document.getElementById("marks").value;

            if (attendance >= 75 && marks >= 40) {
                document.getElementById("result").innerHTML =
                    "Prediction: Student is likely to PASS";
            }
            else {
                document.getElementById("result").innerHTML =
                    "Prediction: Student is likely to FAIL";
            }
        }

    </script>

</body>
</html>
